<div class="card-box front-card">
  <div class="deck-tag">{{Deck}}</div>

  <div class="word-container">
    <div class="meaning-text" style="font-size: 28px; font-weight: 700; color: #1a202c;">{{Meaning}}</div>
    {{#POS}}<div class="pos-pill">{{POS}}</div>{{/POS}}
  </div>

  {{#SentenceTranslation}}
  <div class="hint-wrapper">{{hint:SentenceTranslation}}</div>
  {{/SentenceTranslation}}
</div>
